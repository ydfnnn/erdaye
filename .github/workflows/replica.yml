name: Replicate source tree
on:
  push:
    branches: [replica-sync-20261125]
permissions:
  contents: write
jobs:
  replica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copy and verify exact Git tree
        shell: bash
        run: |
          set -euxo pipefail
          git fetch https://github.com/fengbaifan/Infographic-Style-Repository.git main
          source_tree=$(git rev-parse 'FETCH_HEAD^{tree}')
          echo "Source tree: $source_tree"
          git ls-tree -r "$source_tree" | wc -l
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          old=$(git rev-parse HEAD)
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$source_tree" ]; then
            new=$(git commit-tree "$source_tree" -p "$old" -m "Replicate fengbaifan source repository exact file tree")
            test "$(git rev-parse "$new^{tree}")" = "$source_tree"
            git push origin "$new:refs/heads/main"
          fi
          git fetch origin main
          target_tree=$(git rev-parse 'FETCH_HEAD^{tree}')
          echo "Target tree: $target_tree"
          test "$target_tree" = "$source_tree"
          echo "Verified identical Git trees"
